name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Backup custom files
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/ 2>/dev/null || true
          cp pubspec.yaml /tmp/backup/ 2>/dev/null || true
          ls -R /tmp/backup | head -20
      - name: Create Flutter scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms android --org com.kelola.harian --project-name kelola_harian
          fi
          ls -la | head -20
      - name: Restore custom files
        run: |
          cp -r /tmp/backup/lib/* lib/ 2>/dev/null || true
          cp /tmp/backup/pubspec.yaml . 2>/dev/null || true
          rm -f test/widget_test.dart
          cat pubspec.yaml | head -20
      - name: Patch Android namespace for isar
        run: |
          python3 - << 'PY'
          p = "android/build.gradle.kts"
          s = open(p).read()
          if "api.dsl.LibraryExtension" not in s:
              s = "import com.android.build.api.dsl.LibraryExtension\n\n" + s
          patch = '''
          subprojects {
              plugins.withType<com.android.build.gradle.LibraryPlugin> {
                  extensions.configure<LibraryExtension> {
                      if (namespace == null) namespace = "kelola.harian.lib"
                      val cs = compileSdk
                      if (cs == null || cs < 36) compileSdk = 36
                  }
              }
          }
          '''
          open(p, "w").write(s + patch)
          print(open(p).read()[-800:])
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Patch isar_flutter_libs manifest for AGP8
        run: |
          MANIFEST=$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/ package="[^"]*"//' "$MANIFEST"
            echo "Patched: $MANIFEST"
            grep -n "<manifest" "$MANIFEST"
          else
            echo "ERROR: manifest not found at $MANIFEST"
            ls $HOME/.pub-cache/hosted/pub.dev/ | grep isar || ls -d $HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-* 2>/dev/null
            exit 1
          fi
      - name: Build Isar
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK
        run: flutter build apk --release --dart-define SUPABASE_URL=https://gyvtqjhpbjbqizevavjw.supabase.co --dart-define SUPABASE_ANON=sb_publishable_BtwSwFNniis6CWOy4AykKg_agwLv3Cw
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelola-harian-apk
          path: build/app/outputs/flutter-apk/app-release.apk
